name: Build Dalamud Plugin Repository

on:
  repository_dispatch:
    types:
      - dalamud-plugin-release
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repository, for example archiveduser/siosub-plugin
        required: true
        type: string
      internal_name:
        description: Optional plugin InternalName to disambiguate manifests/assets
        required: false
        type: string
      release_tag:
        description: Release tag containing the plugin zip
        required: false
        type: string
      asset_name:
        description: Optional release asset name
        required: false
        type: string
      asset_url:
        description: Optional direct release asset URL
        required: false
        type: string
      run_url:
        description: Optional source workflow run URL
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dalamud-plugin-repository
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Dalamud repository file
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_SOURCE_TOKEN: ${{ secrets.PLUGIN_SOURCE_TOKEN }}
        run: |
          .\scripts\update-dalamud-repo.ps1 -EventPath $env:GITHUB_EVENT_PATH

      - name: Commit generated repository
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .\dalamud-plugins.json .\plugins

          if (git diff --cached --quiet) {
            Write-Host "No generated repository changes to commit."
            return
          }

          $plugin = if ($env:UPDATED_PLUGIN) { $env:UPDATED_PLUGIN } else { "plugin" }
          $version = if ($env:UPDATED_VERSION) { " $env:UPDATED_VERSION" } else { "" }
          git commit -m "Update Dalamud repo: $plugin$version"
          git push
